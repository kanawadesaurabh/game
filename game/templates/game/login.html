<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NextGen Ludo</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0b0c10; color: white; text-align: center; padding-top: 50px; }
        .box { background: #1f2833; padding: 40px; border-radius: 20px; width: 300px; margin: auto; box-shadow: 0 0 20px #e74c3c; border: 2px solid #ffeb3b; }
        h2 { color: #ffeb3b; }
        input { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; outline: none; }
        .btn { background: #ffeb3b; color: #0b0c10; padding: 10px; width: 100%; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 1.1em; }
        .btn:hover { background: #f1c40f; }
        a { color: #c5c6c7; text-decoration: none; font-size: 0.9em; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🎲 लॉगिन करा</h2>
        <form method="POST">
            {% csrf_token %}
            <input type="text" name="username" placeholder="तुमचे नाव (Username)" required>
            <input type="password" name="password" placeholder="पासवर्ड" required>
            <button type="submit" class="btn">लॉगिन</button>
        </form>
        <br>
        <a href="{% url 'register' %}">नवीन आहात? इथे अकाउंट बनवा</a>
    </div>
</body>
</html>
