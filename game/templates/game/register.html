<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - NextGen Ludo</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0b0c10; color: white; text-align: center; padding-top: 50px; }
        .box { background: #1f2833; padding: 40px; border-radius: 20px; width: 300px; margin: auto; box-shadow: 0 0 20px #45a29e; border: 2px solid #66fcf1; }
        h2 { color: #66fcf1; }
        input { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; outline: none; }
        .btn { background: #45a29e; color: #0b0c10; padding: 10px; width: 100%; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 1.1em; }
        .btn:hover { background: #66fcf1; }
        a { color: #c5c6c7; text-decoration: none; font-size: 0.9em; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🚀 नवीन अकाउंट बनवा</h2>
        <form method="POST">
            {% csrf_token %}
            <input type="text" name="username" placeholder="तुमचे नाव (Username)" required>
            <input type="text" name="phone" placeholder="मोबाईल नंबर" required>
            <input type="password" name="password" placeholder="पासवर्ड टाका" required>
            <button type="submit" class="btn">अकाउंट बनवा</button>
        </form>
        <br>
        <a href="{% url 'login' %}">आधीच अकाउंट आहे? इथे लॉगिन करा</a>
    </div>
</body>
</html>
